name = "xiaojun-ge-github-io"
main = "worker/index.mjs"
compatibility_date = "2026-09-13"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# The existing instance must belong to this Worker's account/default namespace.
[[ai_search]]
binding = "SITE_SEARCH"
instance_name = "self-website-rag"
remote = true

# Approximate per-IP limit per Cloudflare location, not a global spending cap.
[[ratelimits]]
name = "ASK_RATE_LIMITER"
namespace_id = "12012026"
simple = { limit = 10, period = 60 }
